name: Generate Contribution Snake

on:
  # Runs every day at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # Allows manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake (neon SVG + animated GIF)
        uses: Platane/snk@v3
        with:
          github_user_name: vigneshmestha14
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300F0FF&color_dots=%230d1117,%230e4429,%23006d32,%2326a641,%2339d353
            dist/github-contribution-grid-snake.gif?color_snake=%2300F0FF&color_dots=%230d1117,%230e4429,%23006d32,%2326a641,%2339d353

      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "chore: update contribution snake"
